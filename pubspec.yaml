name: churchkr
description: Korean Orthodox Church — Корейская епархия Русской Православной Церкви
publish_to: "none"
version: 1.0.8+8

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/images/app_launcher_icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/adaptive_foreground_icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
